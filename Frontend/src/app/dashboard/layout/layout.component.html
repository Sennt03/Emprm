<mat-sidenav-container class="layout">
  <mat-sidenav
    class="layout__sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="opened()"
    (openedChange)="opened.set($event)"
  >
    <div class="layout__brand">
      <mat-icon>hub</mat-icon>
      <span>ERPM</span>
    </div>
    <mat-divider />
    <mat-nav-list>
      @for (item of navItems; track item.link) {
        @if (!item.adminOnly || isAdmin()) {
          <a
            mat-list-item
            [routerLink]="item.link"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.exact }"
            (click)="closeIfHandset()"
          >
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="layout__content">
    <mat-toolbar class="layout__toolbar">
      <button mat-icon-button (click)="toggle()" aria-label="Menú">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="layout__spacer"></span>
      <button mat-button [matMenuTriggerFor]="menu">
        <mat-icon>account_circle</mat-icon>
        <span class="layout__username">{{ user()?.username }}</span>
      </button>
      <mat-menu #menu="matMenu">
        <a mat-menu-item routerLink="/profile">
          <mat-icon>person</mat-icon>
          <span>Mi perfil</span>
        </a>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Cerrar sesión</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <main class="layout__main">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
