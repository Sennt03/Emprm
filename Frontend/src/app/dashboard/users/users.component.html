<section class="users">
  <h1 class="users__title">Usuarios</h1>

  <mat-card appearance="outlined" class="users__card">
    @if (loading()) {
      <mat-progress-bar mode="indeterminate" />
    }

    <div class="users__table-wrap">
      <table mat-table [dataSource]="users()" class="users__table">
        <ng-container matColumnDef="username">
          <th mat-header-cell *matHeaderCellDef>Usuario</th>
          <td mat-cell *matCellDef="let user">{{ user.username }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let user">{{ user.email }}</td>
        </ng-container>

        <ng-container matColumnDef="roles">
          <th mat-header-cell *matHeaderCellDef>Roles</th>
          <td mat-cell *matCellDef="let user">
            <div class="users__roles">
              @for (role of user.roles; track role) {
                <mat-chip [highlighted]="role === 'ADMIN'">{{ role }}</mat-chip>
              }
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef>Alta</th>
          <td mat-cell *matCellDef="let user">{{ user.createdAt | date: 'shortDate' }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="users__actions-col">Acciones</th>
          <td mat-cell *matCellDef="let user" class="users__actions-col">
            <button mat-icon-button (click)="edit(user)" matTooltip="Editar" aria-label="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            <button
              mat-icon-button
              color="warn"
              (click)="remove(user)"
              [disabled]="isSelf(user)"
              [matTooltip]="isSelf(user) ? 'No puedes eliminarte' : 'Eliminar'"
              aria-label="Eliminar"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      @if (!loading() && users().length === 0) {
        <p class="users__empty">No hay usuarios.</p>
      }
    </div>

    <mat-paginator
      [length]="total()"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[5, 10, 25, 50]"
      (page)="onPage($event)"
      showFirstLastButtons
    />
  </mat-card>
</section>
